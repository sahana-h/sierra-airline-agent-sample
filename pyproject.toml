[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airline-agent"
version = "0.1.0"
description = "A hand-rolled customer-service agent for a fictional airline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airline_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
